<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.4" />
  
  <!-- Glowing circle base -->
  <circle cx="256" cy="256" r="160" fill="#047857" fill-opacity="0.25" filter="url(#glow)" />
  
  <!-- Soccer Ball Design -->
  <circle cx="256" cy="240" r="130" fill="#f8fafc" stroke="#0f172a" stroke-width="8" />
  
  <!-- Central Pentagon -->
  <polygon points="256,170 295,198 280,244 232,244 217,198" fill="#0f172a" />
  
  <!-- Surrounding Lines and Patches -->
  <line x1="256" y1="170" x2="256" y2="114" stroke="#0f172a" stroke-width="8" stroke-linecap="round" />
  <line x1="295" y1="198" x2="350" y2="175" stroke="#0f172a" stroke-width="8" stroke-linecap="round" />
  <line x1="280" y1="244" x2="330" y2="295" stroke="#0f172a" stroke-width="8" stroke-linecap="round" />
  <line x1="232" y1="244" x2="182" y2="295" stroke="#0f172a" stroke-width="8" stroke-linecap="round" />
  <line x1="217" y1="198" x2="162" y2="175" stroke="#0f172a" stroke-width="8" stroke-linecap="round" />
  
  <!-- Edge Patches -->
  <polygon points="256,114 225,120 287,120" fill="#0f172a" />
  <polygon points="350,175 375,205 385,170" fill="#0f172a" />
  <polygon points="330,295 365,310 335,345" fill="#0f172a" />
  <polygon points="182,295 147,310 177,345" fill="#0f172a" />
  <polygon points="162,175 137,205 127,170" fill="#0f172a" />
  
  <!-- Badge Banner -->
  <rect x="96" y="380" width="320" height="64" rx="20" fill="url(#accentGrad)" filter="url(#glow)" />
  <text x="256" y="424" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="bold" fill="#020617" text-anchor="middle" letter-spacing="2">FUTEBOL DOS CRIA</text>
</svg>
